name: Validate

on:
  pull_request:
  push:
    branches: [main]

defaults:
  run:
    working-directory: site

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: Validate restaurants/*.yaml + cities.yaml
        run: npm run data:validate
      - name: Assemble public/deals.json
        run: npm run data:build
      - name: Smoke-test assembled artifact
        run: npm run data:smoke-test
      - name: TypeScript typecheck
        run: npx tsc --noEmit
      - name: ESLint
        run: npx eslint .
      - name: Next build
        run: npm run build
