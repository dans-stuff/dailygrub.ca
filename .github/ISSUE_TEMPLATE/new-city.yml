name: 🏙️ Add a new city
description: Suggest a city we should start covering.
title: "[city] <name>, <province>"
labels: ["new-city"]
body:
  - type: input
    id: city
    attributes:
      label: City name
      placeholder: e.g. Saskatoon
    validations:
      required: true
  - type: input
    id: province
    attributes:
      label: Province (2-letter code)
      placeholder: e.g. SK
    validations:
      required: true
  - type: input
    id: website
    attributes:
      label: A local site we should link to (optional)
      placeholder: e.g. https://example-local-site.ca
  - type: textarea
    id: restaurants
    attributes:
      label: Restaurants in this city worth covering
      description: Bonus points for deals and a source link per restaurant.
      placeholder: |
        - Cathedral Pub — Wing Wednesday, all day
        - The Yard — Half-price apps Mon-Fri 3-6pm
