name: 🍔 Submit a deal
description: Tell us about a happy hour, daily special, or recurring deal at an existing restaurant.
title: "[deal] <restaurant> — <city>"
labels: ["deal"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping! Fill in what you know — we'll figure out the rest. If the restaurant isn't on the site yet, use the **"Submit a new restaurant"** template instead.
  - type: input
    id: restaurant
    attributes:
      label: Restaurant name
      placeholder: e.g. Original Joe's
    validations:
      required: true
  - type: input
    id: city
    attributes:
      label: City
      placeholder: e.g. Lethbridge, AB
    validations:
      required: true
  - type: textarea
    id: deal
    attributes:
      label: The deal(s)
      description: One per line. Include the day(s), any time window, and what's discounted.
      placeholder: |
        Tuesday: half-price wings after 2pm
        Thursday: 50% off wine all day
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: How do you know? (link, photo, or "saw it in-person on YYYY-MM-DD")
      description: A website link or recent photo is ideal. This is the one thing we won't merge without.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else?
      description: Address, phone number, fine print, dine-in vs. takeout, whatever you think might help.
