name: 🛠️ Report a stale or wrong deal
description: A deal on the site is out of date, wrong, or no longer offered.
title: "[fix] <restaurant> — <what's wrong>"
labels: ["correction"]
body:
  - type: input
    id: url
    attributes:
      label: Page where you saw it
      placeholder: https://dailygrub.ca/...
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What's wrong?
      placeholder: e.g. "Half-price wings ended last month" or "Time is now 3-6pm, not 2-5pm"
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: How do you know?
      description: A link, photo, or "called the restaurant on YYYY-MM-DD"
